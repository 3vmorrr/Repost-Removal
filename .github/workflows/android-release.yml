name: Restore clean Android release

on:
  push:
    branches:
      - "restore-clean-v1.1.5"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_STORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Configure Android signing secrets in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$ANDROID_STORE_PASSWORD"
          echo "::add-mask::$ANDROID_KEY_PASSWORD"

      - name: Build signed ad-free APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon assembleRelease

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/Repost-Remover-Android.apk
          python android/scripts/create_update_manifest.py             --tag "android-v1.1.5"             --output release-assets/android-update.json

      - name: Publish clean v1.1.5 as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "android-v1.1.5"             release-assets/Repost-Remover-Android.apk             release-assets/android-update.json             --target "$GITHUB_SHA"             --title "Repost Remover Android android-v1.1.5"             --notes "Restores the last ad-free Android codebase as a new signed update. Ads and ad quotas are removed."             --latest

      - name: Remove ad-supported releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete "android-v1.1.4" --cleanup-tag --yes
          gh release delete "android-v1.1.3" --cleanup-tag --yes
