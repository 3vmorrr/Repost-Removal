<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none';">
  <title>Repost Remover</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="memorial.css">
  <link rel="stylesheet" href="android-mobile.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 15a8 8 0 0 1 14-5l2 2M24 17a8 8 0 0 1-14 5l-2-2M23 7v5h-5M9 25v-5h5"/></svg></span><div><strong>Repost Remover</strong><small data-i18n="brand.desktop">DESKTOP</small></div></div>
      <div class="nav-label" data-i18n="nav.group">WORKSPACE</div>
      <nav id="navigation" aria-label="Navigation">
        <button data-page="home" class="nav-item active"><span class="nav-icon" aria-hidden="true">⌂</span><span data-i18n="nav.home">Home</span></button>
        <button data-page="scan" class="nav-item"><span class="nav-icon" aria-hidden="true">◉</span><span data-i18n="nav.scan">Scan Reposts</span></button>
        <button data-page="review" class="nav-item"><span class="nav-icon" aria-hidden="true">▤</span><span data-i18n="nav.review">Review Results</span><span id="nav-count" class="nav-count" dir="ltr">0</span></button>
        <button data-page="history" class="nav-item"><span class="nav-icon" aria-hidden="true">◷</span><span data-i18n="nav.history">History</span></button>
      </nav>
      <div class="nav-label nav-label-about" data-i18n="nav.about">ABOUT</div>
      <nav aria-label="About">
        <button data-page="developer" class="nav-item developer-nav"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></span><span data-i18n="nav.developer">About the Developer</span></button>
        <button data-page="memorial" class="nav-item memorial-nav"><span class="nav-icon" aria-hidden="true">۞</span><span>صدقة جارية</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-chip"><span class="privacy-dot"></span><div><strong data-i18n="privacy.title">Private on this device</strong><small data-i18n="privacy.detail">Your session and review data stay local</small></div></div>
        <button class="nav-item" data-page="settings"><span class="nav-icon" aria-hidden="true">⚙</span><span data-i18n="nav.settings">Settings</span></button>
        <div class="profile"><span class="avatar" aria-hidden="true">R</span><div><strong id="sidebar-status">Session not checked</strong><small id="sidebar-account">TikTok not connected</small></div></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-title"><span class="crumb">REPOST REMOVER</span><span class="crumb-sep">/</span><strong id="page-heading" dir="auto">Home</strong></div>
        <div class="top-actions"><span id="connection-pill" class="pill muted" aria-live="polite"><i></i><span data-i18n="header.browserUnknown">Session not checked</span></span><button id="theme-toggle" class="icon-button" title="Toggle light and dark theme" aria-label="Toggle light and dark theme">◐</button></div>
      </header>
      <div id="browser-toolbar" class="browser-toolbar hidden">
        <div class="browser-nav-actions">
          <button class="button button-outline small browser-icon-button" id="browser-back" data-browser="back" data-i18n-aria="scan.back" data-i18n-title="scan.back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg></button>
          <button class="button button-outline small browser-icon-button" data-browser="home" data-i18n-aria="scan.home" data-i18n-title="scan.home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button>
          <button class="button button-outline small browser-icon-button" data-browser="reload" data-i18n-aria="scan.reload" data-i18n-title="scan.reload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"/></svg></button>
          <button class="button button-outline small browser-icon-button browser-close" id="browser-close" data-i18n-aria="scan.closeBrowser" data-i18n-title="scan.closeBrowser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
        </div>
        <span class="browser-hint" data-i18n="scan.browserHint">Log in on TikTok. Your password and session stay in this browser profile.</span>
        <div class="browser-primary-actions">
          <button class="button button-outline small" id="browser-check" data-i18n="scan.check">Check login status</button>
          <button class="button button-primary small" id="browser-scan" data-i18n="scan.scanFromToolbar">Start scan</button>
        </div>
      </div>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
      <section id="content" class="content"></section>
    </main>
  </div>
  <nav id="mobile-navigation" aria-label="Navigation" class="mobile-navigation">
    <button class="mobile-nav-item nav-item" data-page="home" data-i18n-aria="nav.home" aria-label="Home"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><small data-i18n="nav.home">Home</small></button>
    <button class="mobile-nav-item nav-item" data-page="scan" data-i18n-aria="nav.scan" aria-label="Scan Reposts"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5M8 11h6M11 8v6"/></svg></span><small data-i18n="nav.scan">Scan Reposts</small></button>
    <button class="mobile-nav-item nav-item" data-page="review" data-i18n-aria="nav.review" aria-label="Review Results"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 4h12v16H8zM4 7v14h12M11 9h6M11 12h6M11 15h4"/></svg></span><small data-i18n="nav.review">Review Results</small></button>
    <button class="mobile-nav-item nav-item" data-page="history" data-i18n-aria="nav.history" aria-label="History"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><small data-i18n="nav.history">History</small></button>
    <button class="mobile-nav-item nav-item" data-page="settings" data-i18n-aria="nav.settings" aria-label="Settings"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.2.9-1.2 2.1-1.4-.6a8 8 0 0 1-1.5.9l-.2 1.5h-2.4l-.3-1.5a8 8 0 0 1-1.6-.9l-1.4.6-1.2-2.1 1.2-.9a7 7 0 0 1 0-1.8l-1.2-.9 1.2-2.1 1.4.6a8 8 0 0 1 1.6-.9l.3-1.5h2.4l.2 1.5a8 8 0 0 1 1.5.9l1.4-.6 1.2 2.1-1.2.9a7 7 0 0 1 0 1.7z"/></svg></span><small data-i18n="nav.settings">Settings</small></button>
  </nav>
  <dialog id="confirm-dialog"><form method="dialog"><div class="dialog-icon" aria-hidden="true">!</div><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="dialog-actions"><button class="button button-outline" value="cancel" data-i18n="common.cancel">Cancel</button><button class="button button-danger" id="dialog-confirm" value="confirm" data-i18n="common.continue">Continue</button></div></form></dialog>
  <script src="android-bridge.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
